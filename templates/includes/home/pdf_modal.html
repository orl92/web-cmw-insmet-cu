<div class="modal fade"
     id="pdfModal"
     tabindex="-1"
     aria-labelledby="pdfModalLabel"
     aria-hidden="true">
  <div class="modal-dialog modal-fullscreen">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="pdfModalLabel">{{ modal_title|default:"PDF" }}</h5>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <div id="modalPdfContainer" class="modal-pdf-container">
          <div id="modalPdfViewer" class="modal-pdf-viewer">
            <div id="modalPdfPages" class="modal-pdf-pages"></div>
          </div>
          <div class="modal-pdf-controls">
            <button type="button"
                    id="modalPrevPage"
                    class="btn btn-sm btn-light"
                    aria-label="Página anterior">‹</button>
            <span id="modalPageInfo" class="modal-page-info" aria-live="polite">Página 1 de 1</span>
            <button type="button"
                    id="modalNextPage"
                    class="btn btn-sm btn-light"
                    aria-label="Página siguiente">›</button>
            <button type="button"
                    id="modalZoomOut"
                    class="btn btn-sm btn-light ms-2"
                    aria-label="Alejar">-</button>
            <span id="modalZoomLevel" class="modal-zoom-level">100%</span>
            <button type="button"
                    id="modalZoomIn"
                    class="btn btn-sm btn-light"
                    aria-label="Acercar">+</button>
            <button type="button"
                    id="modalFitWidth"
                    class="btn btn-sm btn-light ms-2"
                    aria-label="Ajustar al ancho">Ajustar</button>
            <a id="modalDownloadLink"
               class="btn btn-sm btn-link ms-2 text-white"
               href="#"
               download
               aria-label="Descargar PDF">Descargar PDF</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
