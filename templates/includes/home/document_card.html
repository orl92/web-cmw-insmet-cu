{% load my_filters %}
<article class="card">
  <div class="card-body">
    {% if badge %}
      <span class="badge bg-primary mb-2">{{ badge }}</span>
    {% endif %}
    <h3 class="card-title">{{ title }}</h3>
    {% if summary %}
      <p class="text-secondary">{{ summary|sanitize_html }}</p>
    {% endif %}
    <div class="d-flex flex-wrap gap-2 text-secondary mb-3">
      {% if publisher %}
        <span>
          {% if publisher_avatar %}
            <span class="avatar avatar-xs rounded-circle me-1"
                  style="background-image: url('{{ publisher_avatar }}')"></span>
          {% endif %}
          <span class="text-muted me-1">Autor:</span>
          {{ publisher }}
        </span>
      {% endif %}
      {% if date %}
        <span>
          <i class="icon ti ti-calendar"></i> {{ date }}
        </span>
      {% endif %}
    </div>
    {% if pdf_url %}
      <button type="button"
              class="btn btn-pill btn-outline-primary"
              data-bs-toggle="modal"
              data-bs-target="#documentPdfModal"
              data-pdf-url="{{ pdf_url }}"
              data-pdf-title="{{ pdf_title|default:title }}">
        <i class="icon ti ti-file-type-pdf"></i> Ver PDF
      </button>
    {% endif %}
  </div>
</article>
