{% load static %}
<script src="{% static '' %}dist/js/tabler.min.js?v=151" defer></script>
<script src="{% static 'dist/libs/jquery/jquery-3.6.0.min.js' %}"></script>
<script src="{% static 'dist/libs/popper/popper.min.js' %}"></script>
<script src="{% static 'dist/libs/tempus-dominus/dist/js/tempus-dominus.min.js' %}"></script>
<script src="{% static 'dist/js/tempus-init.js' %}"></script>
<script src="{% static 'dist/js/input-sanitize.js' %}"></script>
<script>
	// The floating theme switch was removed: font, radius, base and primary
	// color are now admin-only and come from the SiteConfiguration model.
	// The visitor can only toggle light/dark via the navbar (tabler-theme.min.js).
	// This block re-applies the model values on DOMContentLoaded so the DOM
	// stays consistent even if the head inline script ran before the page
	// rendered (the head script already applied them before first paint).
	var themeSwatches = {
		blue: "#066fd1",
		azure: "#4299e1",
		indigo: "#4263eb",
		purple: "#ae3ec9",
		pink: "#d6336c",
		red: "#d63939",
		orange: "#f76707",
		yellow: "#f59f00",
		lime: "#74b816",
		green: "#2fb344",
		teal: "#0ca678",
		cyan: "#17a2b8"
	};
	var hexToRgb = function (hex) {
		hex = hex.replace("#", "");
		var n = parseInt(hex, 16);
		return (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255);
	};
	document.addEventListener("DOMContentLoaded", function () {
		var config = {
			"theme-base": "{{ site_branding.theme_base }}",
			"theme-font": "{{ site_branding.theme_font }}",
			"theme-primary": "{{ site_branding.primary_color }}",
			"theme-radius": "{{ site_branding.theme_radius }}"
		};
		var root = document.documentElement;
		var primary = config["theme-primary"];
		for (var key in config) {
			var value = config[key];
			if (!!value) {
				if (key === "theme-primary") {
					var hex = themeSwatches[value] || value;
					root.setAttribute("data-bs-theme-primary", hex);
					root.style.setProperty("--tblr-primary", hex);
					root.style.setProperty("--tblr-primary-rgb", hexToRgb(hex));
				} else {
					root.setAttribute("data-bs-" + key, value);
				}
			}
		}
	});
</script>
