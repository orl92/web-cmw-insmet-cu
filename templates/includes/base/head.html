{% load static %}
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="X-UA-Compatible" content="ie=edge" />
{% if site_branding.favicon %}
  <link rel="shortcut icon"
        type="image/png"
        href="{{ site_branding.favicon.url }}" />
{% else %}
  <link rel="shortcut icon"
        type="image/png"
        href="{% static 'dist/img/favicon.ico' %}" />
{% endif %}
<!-- CSS files -->
<link href="{% static 'dist/css/tabler.min.css' %}" rel="stylesheet" />
<link href="{% static 'dist/css/tabler-marketing.min.css' %}"
      rel="stylesheet" />
<link href="{% static 'dist/css/theme.css' %}" rel="stylesheet" />
<link href="{% static 'dist/css/tabler-themes.min.css' %}"
      rel="stylesheet" />
<link href="{% static 'dist/css/tabler-icons.min.css' %}"
      rel="stylesheet" />
<link href="{% static 'dist/css/tabler-socials.min.css' %}"
      rel="stylesheet" />
<link href="{% static 'dist/libs/tempus-dominus/dist/css/tempus-dominus.min.css' %}"
      rel="stylesheet" />
<style>
  /*! @import url("https://rsms.me/inter/inter.css"); */
  body {
    font-feature-settings: 'cv03', 'cv04', 'cv11';
  }
  [data-bs-theme='dark'] .login-image {
    filter: brightness(0) invert(1);
  }
</style>
<!-- Aplica el tema antes del primer paint para evitar parpadeo (FOUC). -->
<script>
	// Font, radius, base and primary come from the admin-only
	// SiteConfiguration model. Light/dark is handled separately by
	// tabler-theme.min.js via ?theme=... / localStorage.
	(function () {
		var swatches = {
			blue: "#066fd1",
			azure: "#4299e1",
			indigo: "#4263eb",
			purple: "#ae3ec9",
			pink: "#d6336c",
			red: "#d63939",
			orange: "#f76707",
			yellow: "#f59f00",
			lime: "#74b816",
			green: "#2fb344",
			teal: "#0ca678",
			cyan: "#17a2b8"
		};
		var hexToRgb = function (hex) {
			hex = hex.replace("#", "");
			var n = parseInt(hex, 16);
			return (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255);
		};
		var model = {
			"theme-base": "{{ site_branding.theme_base }}",
			"theme-font": "{{ site_branding.theme_font }}",
			"theme-radius": "{{ site_branding.theme_radius }}",
			"theme-primary": "{{ site_branding.primary_color }}"
		};
		var root = document.documentElement;
		for (var key in model) {
			var value = model[key];
			if (!!value) {
				if (key === "theme-primary") {
					var hex = swatches[value] || value;
					root.setAttribute("data-bs-theme-primary", hex);
					root.style.setProperty("--tblr-primary", hex);
					root.style.setProperty("--tblr-primary-rgb", hexToRgb(hex));
				} else {
					root.setAttribute("data-bs-" + key, value);
				}
			}
		}
		// Apply the visitor light/dark choice before first paint too, so a
		// saved dark mode does not flash the light palette first. The attribute
		// is ALWAYS set (never removed): light is the explicit server-side
		// default, so <html> invariantly carries data-bs-theme in {light, dark}.
		var theme = new URLSearchParams(window.location.search).get("theme") ||
			localStorage.getItem("tabler-theme") || "light";
		root.setAttribute("data-bs-theme", theme);
	})();
</script>
