<script>
document.addEventListener('DOMContentLoaded', function () {
  const confirmModal = document.getElementById('confirmDeleteModal');
  if (!confirmModal) return;

  const confirmBtn = document.getElementById('confirmDeleteBtn');
  const form = document.getElementById('deleteForm');

  const Bootstrap = (window.tabler && window.tabler.bootstrap) || window.bootstrap;
  const modalInstance = (Bootstrap && Bootstrap.Modal) ? Bootstrap.Modal.getOrCreateInstance(confirmModal) : null;

  document.addEventListener('click', function (e) {
    const btn = e.target.closest('.action-btn');
    if (!btn) return;

    const uuid = btn.dataset.uuid;
    form.action = '{% url delete_url_name "00000000-0000-0000-0000-000000000000" %}'.replace('00000000-0000-0000-0000-000000000000', uuid);
    if (modalInstance) modalInstance.show();
  });

  confirmBtn.addEventListener('click', function () {
    form.submit();
  });
});
</script>
