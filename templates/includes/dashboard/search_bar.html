<form method="get" class="d-flex align-items-center gap-2" id="searchForm">
  <div class="input-group input-group-flat input-group-sm" style="max-width: 280px;">
    <span class="input-group-text">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
        <circle cx="10" cy="10" r="7" />
        <path d="M21 21l-6-6" />
      </svg>
    </span>
    <input type="text" name="q" class="form-control" placeholder="Buscar..." value="{{ request.GET.q }}" id="searchInput">
    {% if request.GET.q %}
      <span class="input-group-text">
        <a href="." class="text-decoration-none text-muted" id="clearSearch">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
            <path d="M18 6l-12 12" /><path d="M6 6l12 12" />
          </svg>
        </a>
      </span>
    {% endif %}
  </div>
</form>
