<!--
  Abre una card de sección para formularios basados en layouts/form.html.
  Uso: incluir este partial y cerrar el body con tres divs:
    card-body, card y col-12 (el body es el tercer div abierto).
-->
<div class="col-12">
  <div class="card">
    <div class="card-body">
      {% if card_title %}
        <h3 class="subheader text-muted fw-medium">{{ card_title }}</h3>
      {% endif %}
