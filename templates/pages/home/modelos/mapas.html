{% extends 'layouts/home.html' %}
{% load static %}
{% block content %}

    <div class="card">
        <div class="card-body">

            <form method="post" id="data-form" class="needs-validation" novalidate>
                {% csrf_token %}
                <div class="row g-3 align-items-center mb-3">
                    <!-- Campo Fecha -->
                    <div class="col-md-4">
                        <label for="datepicker" class="form-label mb-1">
                            <i class="fas fa-calendar-alt me-2"></i>Fecha
                        </label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="datepicker" required>
                            <span class="input-group-text"><i class="fas fa-calendar"></i></span>
                        </div>
                        <div class="invalid-feedback">Por favor seleccione una fecha</div>
                    </div>

                    <label class="form-label me-2">Fecha:</label>
                    <div class="mb-3 d-flex align-items-center">
                        <div class="input-group input-group-flat mb-2">
                            <span class="input-group-text">
                                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                                    <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z"></path>
                                    <path d="M16 3v4"></path>
                                    <path d="M8 3v4"></path>
                                    <path d="M4 11h16"></path>
                                    <path d="M11 15h1"></path>
                                    <path d="M12 15v3"></path>
                                </svg>
                            </span>
                            <input name="date" class="form-control " placeholder="Seleccione una fecha"
                                id="datepicker-icon" value="{{ date }}">
                        </div>
                    </div>

                    <!-- Campo Hora -->
                    <div class="col-md-3">
                        <label for="hour-select" class="form-label mb-1">
                            <i class="fas fa-clock me-2"></i>Hora
                        </label>
                        <select class="form-select" id="hour-select" required>
                            <option value="00">00:00</option>
                            <option value="06">06:00</option>
                            <option value="12">12:00</option>
                            <option value="18">18:00</option>
                        </select>
                    </div>

                    <!-- Campo Variable -->
                    <div class="col-md-3">
                        <label for="id_var_name" class="form-label mb-1">
                            <i class="fas fa-chart-line me-2"></i>Variable
                        </label>
                        <select name="var_name" id="id_var_name" class="form-select" required>
                            {% for value, label in form.var_name.field.choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Botón -->
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-play me-1"></i>Generar
                        </button>
                    </div>
                </div>

                <input type="hidden" id="datetime_init" name="datetime_init" required>
            </form>
        </div>
    </div>

    <div id="plot-area" style="display: none;">
        <div class="card mt-4">
            <div class="card-body">
                <h2 id="plot-title" class="text-center mb-3"></h2>
                <div class="plot-container">
                    <div id="loading" class="loading-overlay">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2">Generando visualización...</p>
                    </div>
                    <div id="animation-container" class="empty-plot-message">
                        <i class="fas fa-chart-area fa-2x mb-2"></i>
                        <p>Seleccione parámetros y genere una visualización</p>
                    </div>
                    <div id="status-message"></div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}

{% block extra_js %}
<!-- Litepicker CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css">

<!-- Litepicker JS -->
<script src="https://cdn.jsdelivr.net/npm/litepicker/dist/litepicker.js"></script>
<!-- Idioma español para Litepicker -->
<script src="https://cdn.jsdelivr.net/npm/litepicker/dist/langs/es-ES.js"></script>

<script src="{% static 'dist/js/maps.js' %}"></script>

<script>
// Clase principal para manejar la visualización meteorológica
class MeteoPlotter {
    constructor(params) {
        // Configuración inicial
        this.datetimeInit = params.datetimeInit;
        this.varName = params.varName;
        this.varLabel = params.varLabel;

        // Elementos del DOM
        this.plotContainer = document.getElementById('plot-container');
        this.loadingElement = document.getElementById('loading');
        this.animationContainer = document.getElementById('animation-container') || this.createAnimationContainer();
        this.statusElement = document.getElementById('status-message') || this.createStatusElement();

        // Configuración de reintentos
        this.maxRetries = 3;
        this.retryDelay = 2000;
        this.retryCount = 0;

        // Estado de la animación
        this.animationHTML = null;
        this.animationScripts = [];
    }

    createAnimationContainer() {
        const container = document.createElement('div');
        container.id = 'animation-container';
        container.className = 'animation-container';
        this.plotContainer.appendChild(container);
        return container;
    }

    createStatusElement() {
        const elem = document.createElement('div');
        elem.id = 'status-message';
        elem.className = 'status-message';
        this.plotContainer.appendChild(elem);
        return elem;
    }

    showStatus(message, type = 'info') {
        const icons = {
            error: 'exclamation-triangle',
            warning: 'exclamation-circle',
            success: 'check-circle',
            info: 'info-circle'
        };

        this.statusElement.innerHTML = `
            <div class="alert alert-${type}">
                <i class="fas fa-${icons[type] || 'info-circle'} me-2"></i>
                ${message}
            </div>
        `;
    }

    showLoading(message, progress = null) {
        let progressBar = '';
        if (progress !== null) {
            progressBar = `
                <div class="progress mt-2" style="height: 6px;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" 
                         style="width: ${progress}%"></div>
                </div>
            `;
        }

        this.loadingElement.innerHTML = `
            <div class="text-center py-3">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="mt-2">${message}</p>
                ${progressBar}
                ${this.retryCount > 0 ? 
                 `<p class="text-muted small mt-2">Intento ${this.retryCount + 1} de ${this.maxRetries}</p>` : ''}
            </div>
        `;
    }

    showRecoveryOptions(errorMessage) {
        this.loadingElement.innerHTML = `
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <strong>Error:</strong> ${errorMessage}
                <div class="mt-3 d-flex justify-content-center">
                    <button class="btn btn-sm btn-primary me-2" id="retry-button">
                        <i class="fas fa-sync-alt me-1"></i> Reintentar
                    </button>
                    <button class="btn btn-sm btn-secondary" id="back-button">
                        <i class="fas fa-arrow-left me-1"></i> Volver
                    </button>
                </div>
            </div>
        `;

        document.getElementById('retry-button').addEventListener('click', () => {
            this.retryCount = 0;
            this.init();
        });

        document.getElementById('back-button').addEventListener('click', () => {
            this.cleanupAnimation();
            document.getElementById('plot-area').style.display = 'none';
        });
    }

    async fetchData() {
        try {
            this.showLoading('Obteniendo datos meteorológicos...', 25);

            const response = await fetch(
                `/api/fetch-data/?datetime_init=${encodeURIComponent(this.datetimeInit)}&var_name=${encodeURIComponent(this.varName)}`,
                {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                }
            );

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || `Error HTTP: ${response.status}`);
            }

            return await response.json();
        } catch (error) {
            console.error('Error en fetchData:', error);
            throw error;
        }
    }

    async generatePlot() {
        try {
            this.showLoading('Generando animación interactiva...', 50);

            const response = await fetch(
                `/api/generate-plot/?var_name=${encodeURIComponent(this.varName)}`,
                {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                }
            );

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || `Error HTTP: ${response.status}`);
            }

            const data = await response.json();
            this.animationHTML = data.animation_html;
            return data;
        } catch (error) {
            console.error('Error en generatePlot:', error);
            throw error;
        }
    }

    showAnimation() {
        this.animationContainer.innerHTML = '';
        this.loadingElement.style.display = 'none';

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = this.animationHTML;

        this.animationScripts = Array.from(tempDiv.querySelectorAll('script'));

        this.animationContainer.innerHTML = tempDiv.innerHTML;

        this.animationScripts.forEach(script => {
            const newScript = document.createElement('script');
            if (script.src) {
                newScript.src = script.src;
            } else {
                newScript.textContent = script.textContent;
            }
            document.body.appendChild(newScript);
        });

        const animationDiv = this.animationContainer.querySelector('div');
        if (animationDiv) {
            animationDiv.style.maxWidth = '100%';
            animationDiv.style.overflow = 'hidden';
        }

        this.showStatus('Animación interactiva cargada', 'success');
    }

    cleanupAnimation() {
        this.animationScripts.forEach(script => {
            if (script.parentNode) {
                script.parentNode.removeChild(script);
            }
        });
        this.animationScripts = [];
        this.animationContainer.innerHTML = '';
    }

    async withRetries(operation) {
        try {
            return await operation();
        } catch (error) {
            this.retryCount++;

            if (this.retryCount < this.maxRetries) {
                this.showStatus(`Reintentando operación... (${this.retryCount}/${this.maxRetries})`, 'warning');
                await new Promise(resolve => setTimeout(resolve, this.retryDelay));
                return this.withRetries(operation);
            } else {
                throw error;
            }
        }
    }

    async init() {
        try {
            this.cleanupAnimation();

            const data = await this.withRetries(() => this.fetchData());
            console.log('Datos recibidos:', data);

            const plotData = await this.withRetries(() => this.generatePlot());
            console.log('Animación generada:', plotData);

            this.showAnimation();

        } catch (error) {
            console.error('Error en MeteoPlotter:', error);
            this.showRecoveryOptions(error.message);

            console.group('Detalles del error');
            console.error('Variable:', this.varName);
            console.error('Fecha:', this.datetimeInit);
            console.error('Mensaje:', error.message);
            console.error('Stack:', error.stack);
            console.groupEnd();
        } finally {
            this.retryCount = 0;
        }
    }
}

// Código de inicialización cuando el DOM está listo
document.addEventListener('DOMContentLoaded', function() {
    // Calcular fechas límite (3 días atrás y 1 día adelante)
    const today = new Date();
    const threeDaysAgo = new Date();
    threeDaysAgo.setDate(today.getDate() - 3);
    const oneDayLater = new Date();
    oneDayLater.setDate(today.getDate() + 1);

    // Formatear fechas para Litepicker (YYYY-MM-DD)
    const formatDate = (date) => {
        return date.toISOString().split('T')[0];
    };

    // Configurar Litepicker con estilos de Tabler
    const datepicker = new Litepicker({
        element: document.getElementById('datepicker'),
        format: 'YYYY-MM-DD',
        lang: 'es-ES',
        minDate: formatDate(threeDaysAgo),
        maxDate: formatDate(oneDayLater),
        resetButton: false,
        dropdowns: {
            minYear: threeDaysAgo.getFullYear(),
            maxYear: oneDayLater.getFullYear(),
            months: true,
            years: true
        },
        buttonText: {
            previousMonth: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1"><path d="M15 6l-6 6l6 6" /></svg>`,
            nextMonth: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1"><path d="M9 6l6 6l-6 6" /></svg>`,
            apply: 'Aplicar',
            cancel: 'Cancelar',
        },
        tooltipText: {
            one: 'día',
            other: 'días'
        },
        // Integración con estilos de Tabler
        setup: (picker) => {
            picker.on('render', (ui) => {
                // Aplicar clases de Tabler al calendario
                const container = ui.querySelector('.container__main');
                if (container) {
                    container.classList.add('dropdown-menu', 'dropdown-menu-end', 'dropdown-menu-arrow');
                }
                
                // Aplicar estilos a los elementos internos
                const elements = ui.querySelectorAll('.container__days, .container__months, .container__years');
                elements.forEach(el => {
                    el.classList.add('list-group', 'list-group-flush');
                });
                
                const dayItems = ui.querySelectorAll('.day-item');
                dayItems.forEach(item => {
                    item.classList.add('list-group-item', 'list-group-item-action');
                });
            });
        }
    });

    // Establecer fecha actual por defecto
    datepicker.setDate(today);

    // Función para actualizar el campo datetime_init
    function updateDatetimeInit() {
        const date = document.getElementById('datepicker').value;
        const hour = document.getElementById('hour-select').value;
        if (date && hour) {
            // Formatear como YYYYMMDDHH (eliminar guiones)
            const formattedDate = date.replace(/-/g, '');
            document.getElementById('datetime_init').value = `${formattedDate}${hour}`;
        }
    }

    // Actualizar cuando cambia la fecha o la hora
    document.getElementById('datepicker').addEventListener('change', updateDatetimeInit);
    document.getElementById('hour-select').addEventListener('change', updateDatetimeInit);

    // Llamar inicialmente para establecer el valor
    updateDatetimeInit();

    const form = document.getElementById('data-form');
    const plotArea = document.getElementById('plot-area');
    const plotTitle = document.getElementById('plot-title');
    const loadingIndicator = document.getElementById('loading');

    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!form.checkValidity()) {
                e.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            plotArea.style.display = 'block';
            loadingIndicator.style.display = 'block';

            try {
                const formData = {
                    datetime_init: document.getElementById('datetime_init').value,
                    var_name: form.var_name.value,
                    csrfmiddlewaretoken: document.querySelector('[name=csrfmiddlewaretoken]').value
                };

                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': formData.csrfmiddlewaretoken
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || 'Error en el servidor');
                }

                const data = await response.json();

                if (data.status !== 'success') {
                    throw new Error(JSON.stringify(data.errors));
                }

                plotTitle.textContent = `${data.var_label} - ${data.datetime_init}`;

                const plotter = new MeteoPlotter({
                    datetimeInit: data.datetime_init,
                    varName: data.var_name,
                    varLabel: data.var_label
                });

                plotter.init();

            } catch (error) {
                console.error('Error:', error);
                loadingIndicator.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        });
    }
});
</script>
{% endblock %}
