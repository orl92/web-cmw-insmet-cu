{% extends 'layouts/form.html' %}
{% load static %}
{% block form %}
  <div class="mb-3">
    <label class="form-label required">{{ form.name.label }}</label>
    <input type="text" class="form-control {% if form.name.errors %}is-invalid{% endif %}" 
      id="{{ form.name.id_for_label }}" name="{{ form.name.name }}" placeholder="Nombre" autofocus required />
    {% if form.name.errors %}
      <span class="invalid-feedback">{{ form.name.errors.0 }}</span>
    {% endif %}
  </div>
  <div class="mb-3">
    <label class="form-label required">{{ form.code.label }}</label>
    <input type="text" class="form-control {% if form.code.errors %}is-invalid{% endif %}" 
      id="{{ form.code.id_for_label }}" name="{{ form.code.name }}" placeholder="Código" required />
    {% if form.code.errors %}
      <span class="invalid-feedback">{{ form.code.errors.0 }}</span>
    {% endif %}
  </div>
{% endblock %}
