<div>
  <h3 class="card-title">Título: {{ cyclone.title }}</h3>
  <div class="text-secondary">Asunto: {{ cyclone.subject }}</div>
  <div class="mt-3 text-secondary">
    <div>Fecha: {{ cyclone.date }}</div>
    <div class="mt-3">
      <span class="avatar avatar-xs rounded-circle me-1" style="background-image: url({{ cyclone.user.profile.get_avatar }})"></span>
      <span class="text-muted me-2 d-none d-sm-inline">Autor:</span>
      <span>{{ cyclone.user.get_full_name }}</span>
    </div>
  </div>
  <div class="mt-3">
    <img src="{{ cyclone.get_image }}" alt="{{ cyclone.title }}" class="img-fluid">
  </div>
  <div class="mt-3">{{ cyclone.description|safe }}</div>
  <svg xmlns="http://www.w3.org/2000/svg"  width="16"  height="16"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-calendar-time text-muted"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M11.795 21h-6.795a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v4" /><path d="M18 18m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M15 3v4" /><path d="M7 3v4" /><path d="M3 11h16" /><path d="M18 16.496v1.504l1 1" /></svg>
  <span class="text-muted ms-1">Válido hasta:</span>
  <span class="text-muted ms-1">{{ cyclone.valid_until }}</span>
</div>
