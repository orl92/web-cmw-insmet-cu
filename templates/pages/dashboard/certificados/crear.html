{% extends 'layouts/form.html' %}
{% load static %}

{% block form %}
    <div class="mb-3">
      <label class="form-label required">{{ form.subscription.label }}</label>
      <select class="form-control {% if form.subscription.errors %}is-invalid{% endif %}"
              id="{{ form.subscription.id_for_label }}" name="{{ form.subscription.name }}" required>
        <option value="">Seleccione una suscripción</option>
        {% for sub in form.subscription.field.queryset %}
          <option value="{{ sub.pk }}" {% if form.subscription.value|stringformat:"s" == sub.pk|stringformat:"s" %}selected{% endif %}>
            {{ sub.customer.company_name }} - {{ sub.service.title }}
          </option>
        {% endfor %}
      </select>
      {% if form.subscription.errors %}
        <div class="invalid-feedback">{{ form.subscription.errors.0 }}</div>
      {% endif %}
    </div>

    <div class="mb-3">
      <label class="form-label required">{{ form.pdf.label }}</label>
      <input type="file" class="form-control {% if form.pdf.errors %}is-invalid{% endif %}"
             id="{{ form.pdf.id_for_label }}" name="{{ form.pdf.name }}"
             accept=".pdf" required>
      {% if form.pdf.errors %}
        <div class="invalid-feedback">{{ form.pdf.errors.0 }}</div>
      {% endif %}
    </div>
{% endblock %}
