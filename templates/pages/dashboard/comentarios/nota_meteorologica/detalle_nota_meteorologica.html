<div class="card-body markdown">
  <h1 class="d-flex justify-content-center">Nota Meteorológica para la Provincia de Camagüey</h1>
  <h3 class="d-flex justify-content-center">Departamento de Pronósticos</h3>
  <div class="d-flex justify-content-between">
    <p>
      <strong>Fecha:</strong> {{ weather_note.date|date:'j \d\e F \d\e Y' }}
    </p>
    <p>
      <strong>Hora:</strong> {{ weather_note.date|time:'h:i A' }}
    </p>
  </div>
  <p class="d-flex justify-content-center">{{ weather_note.subject }}</p>
  <p>{{ weather_note.detailed_note|safe }}</p>
  <div class="d-flex align-items-center">
    <span class="avatar avatar-xs rounded-circle me-1" style="background-image: url({{ weather_note.user.profile.get_avatar }})"></span>
    <span class="text-muted me-2 d-none d-sm-inline">Autor:</span>
    <span>{{ weather_note.user.get_full_name }}</span>
  </div>
</div>
