{% extends 'layouts/form.html' %}
{% load static %}

{% block form %}
<div class="mb-3">
  <label class="form-label required">{{ form.title.label }}</label>
  <input type="text" class="form-control" name="{{ form.title.name }}" value="{{ object.title }}" required>
</div>
<div class="mb-3">
  <label class="form-label required">{{ form.summary.label }}</label>
  <input type="text" class="form-control" name="{{ form.summary.name }}" value="{{ object.summary }}" required>
</div>
<div class="mb-3">
  <label class="form-label required">{{ form.service_type.label }}</label>
  <select class="form-control" name="{{ form.service_type.name }}" id="id_service_type" required>
    {% for choice in form.service_type.field.choices %}
      <option value="{{ choice.0 }}" {% if choice.0 == object.service_type %}selected{% endif %}>{{ choice.1 }}</option>
    {% endfor %}
  </select>
</div>

<div class="mb-3" id="field_file" style="display: {% if object.service_type == 'commercial' %}none{% else %}block{% endif %};">
  <label class="form-label">{{ form.file.label }}</label>
  <input type="file" class="form-control" name="{{ form.file.name }}" accept=".pdf">
  {% if object.file %}
    <p>Archivo actual: <a href="{{ object.file.url }}" target="_blank">{{ object.file.name }}</a></p>
  {% endif %}
  <small class="form-hint" id="file_hint">Obligatorio solo para servicios públicos.</small>
</div>
{% endblock %}

{% block extrajs %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const serviceType = document.getElementById('id_service_type');
    const fileField = document.getElementById('field_file');

    function toggleFields() {
      const isCommercial = serviceType.value === 'commercial';
      fileField.style.display = isCommercial ? 'none' : 'block';
    }

    toggleFields();
    serviceType.addEventListener('change', toggleFields);
  });
</script>
{% endblock %}
