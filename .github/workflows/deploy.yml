name: Deploy production

# Despliegue a https://web.cmw.insmet.cu.
#
# La logica esta en deploy/deploy.sh, que corre EN el servidor. Este workflow
# solo se conecta por SSH y lo invoca. Una sola fuente de verdad: si el
# procedimiento cambia, cambia en el script y el workflow no se entera.
#
# Que NO esta aca: migraciones, collectstatic, gates. Si estan en los dos lados,
# el dia que uno de los dos cambie, el deploy hace cosas distintas segun por donde
# entro, y eso no se depura.

on:
  # Automatico: cuando el CI de main termine en verde.
  #
  # No se puede usar `needs:` entre workflows, asi que el gate se resuelve
  # filtrando por conclusion. El filtro por `workflows:` limita esto al workflow
  # CI y no a cualquier otro que termine en main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # Manual: reintento, rollback o despliegue de un fix caliente.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit a desplegar (SHA o rama). Por defecto, main.'
        required: false
        default: main
      previous:
        description: 'Commit de respaldo para el rollback automatico. Por defecto, el que esta en el servidor.'
        required: false
        default: ''

# cancel-in-progress: false es lo importante. Cancelar un deploy a mitad de
# `migrate` deja el esquema a medio aplicar y el codigo viejo sirviendo contra
# el. Dos deploys simultaneos tambien estan mal, asi que el grupo serializa.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# Si el environment "production" tiene required reviewers, el deploy queda
# esperando aprobacion humana. Configurarlo en Settings > Environments.
environment: production

jobs:
  deploy:
    name: Deploy to web.cmw.insmet.cu
    runs-on: ubuntu-latest

    # El deploy dura alrededor de 5 minutos, de los cuales ~3 son de
    # `collectstatic` (hashear y comprimir en gzip+brotli los ~900 estaticos,
    # 114 MB). Es un piso, no un techo: si collectstatic va bien, se acerca a 2.
    # 30 deja margen de sobra y evita que un `deploy.sh` colgado queme el runner
    # las 6 horas que es el timeout por defecto de un job.
    timeout-minutes: 30

    # El environment expone sus secretos como `environment.*`. Si se define el
    # secret a nivel de repo con el mismo nombre, no hay colision: el del
    # environment tiene prioridad y es el que se resuelve.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

    steps:
      - name: Resolver commit a desplegar
        id: target
        env:
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MANUAL_REF: ${{ inputs.ref }}
          MANUAL_PREVIOUS: ${{ inputs.previous }}
        run: |
          set -Eeuo pipefail

          if [ "$AUTOMATIC" = "true" ]; then
            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "::notice::El CI de main termino en '$CI_CONCLUSION'. No se despliega."
              echo "resolving=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # El filtro `branches: [main]` ya acota esto; se repite porque el
            # filtro se aplica al push que disparo el workflow y un PR mergeado
            # tambien reporta head_branch distinto segun como se mire.
            if [ "$CI_BRANCH" != "main" ]; then
              echo "::notice::El workflow corrio en la rama '$CI_BRANCH', no main. No se despliega."
              echo "resolving=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "Commit del CI en verde: $sha"
          else
            sha=$(git ls-remote "https://github.com/${{ github.repository }}.git" \
              "$MANUAL_REF" | awk 'NR==1 {print $1}')
            if [ -z "$sha" ]; then
              echo "::error::No se pudo resolver '$MANUAL_REF' a un commit."
              exit 1
            fi
            echo "Despliegue manual de '$MANUAL_REF' -> $sha"
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolving=true" >> "$GITHUB_OUTPUT"

      - name: Desplegar por SSH
        if: steps.target.outputs.resolving == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          set -Eeuo pipefail

          [ -n "$DEPLOY_HOST" ] || { echo "::error::Falta el secret DEPLOY_HOST."; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Falta el secret DEPLOY_SSH_KEY."; exit 1; }
          [ -n "$SSH_KNOWN_HOSTS" ] || { echo "::error::Falta el secret DEPLOY_SSH_KNOWN_HOSTS."; exit 1; }

          # La clave vive lo menos posible: un solo step la escribe, la usa y la
          # borra. En un runner efimero no hay drama igual, pero una clave
          # privada en disco el tiempo que dura el job es una clave privada en
          # disco el tiempo que dura el job.
          keydir=$(mktemp -d)
          chmod 700 "$keydir"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$keydir/id_ed25519"
          chmod 600 "$keydir/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$keydir/known_hosts"
          chmod 600 "$keydir/known_hosts"

          user="${DEPLOY_USER:-deploy}"

          # StrictHostKeyChecking=yes y no accept-new: si la clave del host
          # cambia, esto falla en vez de continuar. Un deploy que acepta una
          # host key desconocida envia la clave de despliegue a cualquiera que
          # responda ese puerto.
          ssh_opts=(
            -i "$keydir/id_ed25519"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$keydir/known_hosts"
            -o ConnectTimeout=20
          )

          args=("$SHA")
          if [ -n "$PREVIOUS" ]; then
            echo "Respaldo explicito: $PREVIOUS"
            args+=("$PREVIOUS")
          fi

          ssh "${ssh_opts[@]}" "$user@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/webcmp-deploy ${args[*]}"
