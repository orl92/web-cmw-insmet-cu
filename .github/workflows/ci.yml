name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      meteo: ${{ steps.paths.outputs.meteo }}
      api: ${{ steps.paths.outputs.api }}
      user_auth: ${{ steps.paths.outputs.user_auth }}
      core: ${{ steps.paths.outputs.core }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      commercial: ${{ steps.paths.outputs.commercial }}
      home: ${{ steps.paths.outputs.home }}
      publications: ${{ steps.paths.outputs.publications }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            meteo: 'apps/meteo/**'
            api: 'apps/api/**'
            user_auth: 'apps/user_auth/**'
            core: 'apps/core/**'
            dashboard: 'apps/dashboard/**'
            commercial: 'apps/commercial/**'
            home: 'apps/home/**'
            publications: 'apps/publications/**'
            full:
              - 'config/**'
              - 'manage.py'
              - 'requirements/**'
              - 'pyproject.toml'
              - '.github/**'
              - 'templates/**'
              - 'static/**'

  test:
    name: Tests (Django)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Django system check
        run: python manage.py check

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run affected app tests (PR)
        if: github.event_name == 'pull_request' && needs.detect.outputs.full == 'false'
        run: |
          LABELS=""
          [ "${{ needs.detect.outputs.meteo }}" = "true" ] && LABELS="$LABELS apps.meteo"
          [ "${{ needs.detect.outputs.api }}" = "true" ] && LABELS="$LABELS apps.api"
          [ "${{ needs.detect.outputs.user_auth }}" = "true" ] && LABELS="$LABELS apps.user_auth"
          [ "${{ needs.detect.outputs.core }}" = "true" ] && LABELS="$LABELS apps.core"
          [ "${{ needs.detect.outputs.dashboard }}" = "true" ] && LABELS="$LABELS apps.dashboard"
          [ "${{ needs.detect.outputs.commercial }}" = "true" ] && LABELS="$LABELS apps.commercial"
          [ "${{ needs.detect.outputs.home }}" = "true" ] && LABELS="$LABELS apps.home"
          [ "${{ needs.detect.outputs.publications }}" = "true" ] && LABELS="$LABELS apps.publications"
          if [ -z "$LABELS" ]; then
            echo "No se detectaron apps afectadas; se corre la suite completa como seguridad."
            python manage.py test
          else
            echo "Apps afectadas:$LABELS"
            python manage.py test $LABELS
          fi

      - name: Run full test suite (push to main)
        if: github.event_name == 'push' || needs.detect.outputs.full == 'true'
        run: python manage.py test

  deploy-check:
    name: Deploy check (check --deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      # `prod.txt` y no `test.txt`: el gate tiene que correr con el CONJUNTO DE
      # DEPENDENCIAS DE PRODUCCIÓN, no con el de desarrollo. Un gate que instala
      # otra cosa verifica otro entorno, y no puede ver, por ejemplo, que falte el
      # driver de PostgreSQL en el archivo que se instala en el servidor.
      - name: Install dependencies
        run: pip install -r requirements/prod.txt

      # El .env está en .gitignore y CI no puede tener claves reales, así que el
      # gate genera su propio par con el MISMO generador que usa el servidor.
      #
      # Esto ya no es un snippet inline: `scripts/generate_env.py` no importa
      # Django, así que funciona en un checkout limpio, que es exactamente el
      # estado de este job. Que el gate dependa del script de producción es lo que
      # hace que una regresión en el generador se vea acá y no en el servidor.
      #
      # El archivo va a RUNNER_TEMP, NO al checkout: el job no corre producción
      # (produce SQLite y DEBUG=True), así que lo que necesita son las dos
      # variables en el entorno del paso siguiente. Nada se commitea ni persiste.
      - name: Generate throwaway Fernet pair
        run: |
          python scripts/generate_env.py --development --env-file "$RUNNER_TEMP/.env"
          grep -E '^(SECRET_KEY|ENCRYPTION_KEY)=' "$RUNNER_TEMP/.env" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/.env"

      - name: Run deployment checks (production profile)
        env:
          # Sin esto el dispatcher elige dev/testing, no producción (ver
          # config/settings/__init__.py). `DEBUG` NO se pasa: production.py lo
          # pinea en False justamente para que un DEBUG=True del entorno no imponga.
          PRODUCTION: "1"
          # El motor es el REAL de producción (PostgreSQL), no sqlite3. Cargar los
          # modelos importa el ENGINE, así que este paso detecta un driver faltante en
          # requirements/prod.txt -- el fallo que de verdad mata un deploy:
          # `ImproperlyConfigured: Error loading psycopg2 or psycopg module`, antes de
          # tocar la base. Con sqlite3 el gate era ciego a eso.
          # `check --deploy` NO abre conexiones: las credenciales de abajo existen solo
          # porque `get_database_config` las exige para un motor de red. El pragma de
          # `DB_PASS` es lo que corresponde a un placeholder; en la versión sqlite3 no
          # hacía falta porque ese motor no pedía ninguna.
          DB_ENGINE: postgresql
          DB_NAME: webcmp
          DB_USER: webcmp
          DB_HOST: localhost
          DB_PASS: ci_placeholder_not_a_real_password  # pragma: allowlist secret
        run: python manage.py check --deploy --fail-level WARNING

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Ruff
        run: ruff check .

  security:
    name: Security (pip-audit + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements/base.txt --ignore-vuln PYSEC-2026-2860
          pip-audit -r requirements/prod.txt --ignore-vuln PYSEC-2026-2860

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

  templates:
    name: Templates (djlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Check template formatting
        run: djlint . --reformat --check

      - name: Lint templates
        run: djlint . --lint

  precommit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
