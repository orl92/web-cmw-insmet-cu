name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter@v3 usa la API listFiles para eventos pull_request.
  # Sin pull-requests: read el job falla con "Resource not accessible by
  # integration", y como test dependsOn detect, la suite completa tampoco
  # corria en ningun PR. En push a main usaba diff de git y por eso el bug
  # no se veia desde el workflow de main.
  pull-requests: read

jobs:
  detect:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      meteo: ${{ steps.paths.outputs.meteo }}
      api: ${{ steps.paths.outputs.api }}
      user_auth: ${{ steps.paths.outputs.user_auth }}
      core: ${{ steps.paths.outputs.core }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      commercial: ${{ steps.paths.outputs.commercial }}
      home: ${{ steps.paths.outputs.home }}
      publications: ${{ steps.paths.outputs.publications }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            meteo: 'apps/meteo/**'
            api: 'apps/api/**'
            user_auth: 'apps/user_auth/**'
            core: 'apps/core/**'
            dashboard: 'apps/dashboard/**'
            commercial: 'apps/commercial/**'
            home: 'apps/home/**'
            publications: 'apps/publications/**'
            full:
              - 'config/**'
              - 'manage.py'
              - 'requirements/**'
              - 'pyproject.toml'
              - '.github/**'
              - 'templates/**'
              - 'static/**'

  test:
    name: Tests (Django)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Django system check
        run: python manage.py check

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run affected app tests (PR)
        if: github.event_name == 'pull_request' && needs.detect.outputs.full == 'false'
        run: |
          LABELS=""
          [ "${{ needs.detect.outputs.meteo }}" = "true" ] && LABELS="$LABELS apps.meteo"
          [ "${{ needs.detect.outputs.api }}" = "true" ] && LABELS="$LABELS apps.api"
          [ "${{ needs.detect.outputs.user_auth }}" = "true" ] && LABELS="$LABELS apps.user_auth"
          [ "${{ needs.detect.outputs.core }}" = "true" ] && LABELS="$LABELS apps.core"
          [ "${{ needs.detect.outputs.dashboard }}" = "true" ] && LABELS="$LABELS apps.dashboard"
          [ "${{ needs.detect.outputs.commercial }}" = "true" ] && LABELS="$LABELS apps.commercial"
          [ "${{ needs.detect.outputs.home }}" = "true" ] && LABELS="$LABELS apps.home"
          [ "${{ needs.detect.outputs.publications }}" = "true" ] && LABELS="$LABELS apps.publications"
          if [ -z "$LABELS" ]; then
            echo "No se detectaron apps afectadas; se corre la suite completa como seguridad."
            python manage.py test
          else
            echo "Apps afectadas:$LABELS"
            python manage.py test $LABELS
          fi

      - name: Run full test suite (push to main)
        if: github.event_name == 'push' || needs.detect.outputs.full == 'true'
        run: python manage.py test

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Ruff
        run: ruff check .

  security:
    name: Security (pip-audit + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Audit Python dependencies
        # PYSEC-2026-2860 (pdfkit): command injection via untrusted URLs; el
        # proyecto usa pdfkit.from_string con HTML generado internamente. Sin fix disponible.
        # base.txt cubre el runtime de la app; prod.txt añade el servidor WSGI
        # (gunicorn), que NO está en base.txt y por eso necesita su propia pasada.
        run: |
          pip-audit -r requirements/base.txt --ignore-vuln PYSEC-2026-2860
          pip-audit -r requirements/prod.txt --ignore-vuln PYSEC-2026-2860

      # Migrations are NOT versioned in this repo (.gitignore excludes
      # **/migrations/*). In a fresh checkout there are none, so generate
      # + apply them from the current models before the deployment check.
      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

  templates:
    name: Templates (djlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Check template formatting
        run: djlint . --reformat --check

      - name: Lint templates
        run: djlint . --lint

  precommit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
