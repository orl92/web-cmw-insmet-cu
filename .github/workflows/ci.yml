name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter@v3 usa la API listFiles para eventos pull_request.
  # Sin pull-requests: read el job falla con "Resource not accessible by
  # integration", y como test dependsOn detect, la suite completa tampoco
  # corria en ningun PR. En push a main usaba diff de git y por eso el bug
  # no se veia desde el workflow de main.
  pull-requests: read

jobs:
  detect:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      meteo: ${{ steps.paths.outputs.meteo }}
      api: ${{ steps.paths.outputs.api }}
      user_auth: ${{ steps.paths.outputs.user_auth }}
      core: ${{ steps.paths.outputs.core }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      commercial: ${{ steps.paths.outputs.commercial }}
      home: ${{ steps.paths.outputs.home }}
      publications: ${{ steps.paths.outputs.publications }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            meteo: 'apps/meteo/**'
            api: 'apps/api/**'
            user_auth: 'apps/user_auth/**'
            core: 'apps/core/**'
            dashboard: 'apps/dashboard/**'
            commercial: 'apps/commercial/**'
            home: 'apps/home/**'
            publications: 'apps/publications/**'
            full:
              - 'config/**'
              - 'manage.py'
              - 'requirements/**'
              - 'pyproject.toml'
              - '.github/**'
              - 'templates/**'
              - 'static/**'

  test:
    name: Tests (Django)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      - name: Django system check
        run: python manage.py check

      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run affected app tests (PR)
        if: github.event_name == 'pull_request' && needs.detect.outputs.full == 'false'
        run: |
          LABELS=""
          [ "${{ needs.detect.outputs.meteo }}" = "true" ] && LABELS="$LABELS apps.meteo"
          [ "${{ needs.detect.outputs.api }}" = "true" ] && LABELS="$LABELS apps.api"
          [ "${{ needs.detect.outputs.user_auth }}" = "true" ] && LABELS="$LABELS apps.user_auth"
          [ "${{ needs.detect.outputs.core }}" = "true" ] && LABELS="$LABELS apps.core"
          [ "${{ needs.detect.outputs.dashboard }}" = "true" ] && LABELS="$LABELS apps.dashboard"
          [ "${{ needs.detect.outputs.commercial }}" = "true" ] && LABELS="$LABELS apps.commercial"
          [ "${{ needs.detect.outputs.home }}" = "true" ] && LABELS="$LABELS apps.home"
          [ "${{ needs.detect.outputs.publications }}" = "true" ] && LABELS="$LABELS apps.publications"
          if [ -z "$LABELS" ]; then
            echo "No se detectaron apps afectadas; se corre la suite completa como seguridad."
            python manage.py test
          else
            echo "Apps afectadas:$LABELS"
            python manage.py test $LABELS
          fi

      - name: Run full test suite (push to main)
        if: github.event_name == 'push' || needs.detect.outputs.full == 'true'
        run: python manage.py test

  deploy-check:
    name: Deploy check (check --deploy)
    # Job propio, sin `needs: detect`: el gate de seguridad tiene que correr en
    # TODOS los PR y pushes, no solo cuando el filtro de paths marca apps. Un
    # `DEBUG=True` colado en un perfil de producción no toca ninguna app, y un
    # check de seguridad que depende de qué archivos cambiaron no es un check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/test.txt

      # El .env está en .gitignore y CI no puede tener claves reales, así que el
      # gate genera su propio par Fernet. Se usa `get_random_secret_key()` como
      # texto plano (el MISMO generador que usa generate_env) y no una cadena fija:
      # `security.W009` rechaza claves de menos de 50 caracteres o con menos de 5
      # caracteres distintos, y una constante tipo "xxxxx".make el gate fallar por
      # una causa que no es una regresión de seguridad.
      #
      # El script escribe en GITHUB_ENV, que inyecta las variables en los pasos
      # siguientes. Nada se persiste en el checkout.
      - name: Generate throwaway Fernet pair
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from cryptography.fernet import Fernet
          from django.core.management.utils import get_random_secret_key

          encryption_key = Fernet.generate_key().decode()
          secret_key = Fernet(encryption_key.encode()).encrypt(get_random_secret_key().encode()).decode()
          print(f'ENCRYPTION_KEY={encryption_key}')
          print(f'SECRET_KEY={secret_key}')
          PY

      - name: Run deployment checks (production profile)
        env:
          # Sin esto el dispatcher elige dev/testing, no producción (ver
          # config/settings/__init__.py). `DEBUG` NO se pasa: production.py lo
          # pinea en False justamente para que un DEBUG=True del entorno no imponga.
          PRODUCTION: "1"
          # check --deploy no abre conexiones, pero cargar los modelos sí necesita
          # un ENGINE importable y requirements/ NO trae driver de Postgres ni de
          # MySQL: sqlite3 es el único motor que no agrega dependencia de terceros.
          # sqlite3 tampoco pide credenciales (`get_database_config` corta antes del
          # chequeo de DB_USER/DB_PASS para ese motor), así que el gate no carga
          # ninguna credencial: ni real, ni de mentira.
          DB_ENGINE: sqlite3
        # --fail-level WARNING explícito: el default de `check` es ERROR, y con
        # ERROR un W00x de despliegue pasaría el gate sin que nadie lo note.
        run: python manage.py check --deploy --fail-level WARNING

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Ruff
        run: ruff check .

  security:
    name: Security (pip-audit + migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Audit Python dependencies
        # PYSEC-2026-2860 (pdfkit): command injection via untrusted URLs; el
        # proyecto usa pdfkit.from_string con HTML generado internamente. Sin fix disponible.
        # base.txt cubre el runtime de la app; prod.txt añade el servidor WSGI
        # (gunicorn), que NO está en base.txt y por eso necesita su propia pasada.
        run: |
          pip-audit -r requirements/base.txt --ignore-vuln PYSEC-2026-2860
          pip-audit -r requirements/prod.txt --ignore-vuln PYSEC-2026-2860

      # Migrations are NOT versioned in this repo (.gitignore excludes
      # **/migrations/*). In a fresh checkout there are none, so generate
      # + apply them from the current models before the deployment check.
      - name: Generate and apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

  templates:
    name: Templates (djlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Check template formatting
        run: djlint . --reformat --check

      - name: Lint templates
        run: djlint . --lint

  precommit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
