name: Security scan (Bandit)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "42 18 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system dependencies (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install dev dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Bandit
        run: bandit -r apps config manage.py -ll -x "*test*.py,*migrations*"

  # El gate de `check --deploy` (change 013-check-deploy-ci) estuvo ACA hasta que
  # `config/settings.py` se partió en perfiles. Corría sin `PRODUCTION` en el
  # entorno, así que el dispatcher elegía `testing`, NO `production`: el job
  # comprobaba un perfil que producción nunca usa, y su comentario ("DEBUG
  # defaults to False so the production security block is active") quedó en
  # falso sin que nadie lo notara. Vive ahora en ci.yml como `deploy-check`,
  # corriendo bajo `PRODUCTION=1` y con su propio par Fernet, que es el estado
  # que de verdad se despliega. Este workflow queda solo con Bandit.
