name: Security scan (Bandit)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "42 18 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Bandit
        run: bandit -r apps config manage.py -ll -x "*test*.py,*migrations*"
