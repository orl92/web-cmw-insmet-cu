[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".venv",
    "static",
    "staticfiles",
    "media",
    "logs",
    "*/migrations/*",
    "schema.yml",
    "spec",
    # Archived SDD changes are historical records; the ruff-format hook covers
    # markdown, so without this it rewrites their code blocks on every tool bump.
    "openspec/changes/archive",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Los perfiles hacen `from .base import *` a propósito: cada uno es un módulo de
# settings completo, no un selector. F403/F405 son consecuencia de eso, no descuido.
"config/settings/*.py" = ["F403", "F405"]
# Decodificadores de formatos WMO: los nombres siguen el spec meteorológico (FM12,
# iW, get_ddViento) y los comentarios de spec se dejan tal cual por legibilidad.
"apps/api/data/*.py" = ["E501", "N802", "N803", "N806", "F403", "F405"]
# Notación meteorológica estándar (T, Td, RM, LM, MW) en los generadores de gráficos.
"apps/home/data/plot_generators.py" = ["N806"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.bandit]
exclude_dirs = [".venv", "static", "staticfiles", "media", "*/migrations/*"]
targets = ["apps", "config", "manage.py"]

[tool.djlint]
profile = "django"
indent = 2
format_attribute_template_tags = true
quote_style = "single"
ignore = [
    "H005",
    "H016",
    "H021",
    "H023",
    "H025",
    "H026",
    "H030",
    "H037",
    "D018",
]
extend_exclude = ["emails", "static", "media", "logs", "migrations", "spec"]
