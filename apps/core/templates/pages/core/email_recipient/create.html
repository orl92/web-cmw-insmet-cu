{% extends 'layouts/form.html' %}
{% block form %}
  {% include 'pages/core/email_recipient/_form.html' %}
{% endblock %}

{% block extrajs %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var tbody = document.getElementById('recipient-tbody');
    var totalForms = document.getElementById('id_recipients-TOTAL_FORMS');

    function recipientRowHtml(index) {
      return '<tr>' +
        '<td>' +
          '<input type="email" class="form-control" name="recipients-' + index + '-email" value="" placeholder="Correo Electrónico">' +
        '</td>' +
        '<td class="align-middle text-center">' +
          '<input type="hidden" name="recipients-' + index + '-uuid" value="">' +
          '<input type="checkbox" name="recipients-' + index + '-DELETE" class="recipient-delete" value="on" hidden>' +
          '<button type="button" class="btn btn-icon btn-outline-danger btn-sm delete-recipient" title="Eliminar destinatario">' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-trash">' +
              '<path stroke="none" d="M0 0h24v24H0z" fill="none"/>' +
              '<path d="M4 7l16 0"/>' +
              '<path d="M10 11l0 6"/>' +
              '<path d="M14 11l0 6"/>' +
              '<path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/>' +
              '<path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/>' +
            '</svg>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }

    document.getElementById('add-recipient').addEventListener('click', function () {
      var index = parseInt(totalForms.value, 10);
      tbody.insertAdjacentHTML('beforeend', recipientRowHtml(index));
      totalForms.value = index + 1;
    });

    tbody.addEventListener('click', function (event) {
      var button = event.target.closest('.delete-recipient');
      if (!button) return;
      var row = button.closest('tr');
      var deleteCheckbox = row.querySelector('.recipient-delete');
      if (deleteCheckbox) {
        deleteCheckbox.checked = true;
      }
      row.classList.add('d-none');
    });
  });
</script>
{% endblock extrajs %}
