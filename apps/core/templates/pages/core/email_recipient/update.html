{% extends 'layouts/form.html' %}
{% block form %}
  {% include 'pages/core/email_recipient/_form.html' %}
{% endblock %}
{% block extrajs %}
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const tbody = document.getElementById('recipient-tbody');
    const totalForms = document.getElementById('id_recipients-TOTAL_FORMS');
    const addBtn = document.getElementById('add-recipient');
    let formIndex = {{ formset.total_form_count }};

    function recipientRowHtml(index) {
      return `
        <tr data-index="${index}">
          <td>
            <input type="email" class="form-control" name="recipients-${index}-email" value="" placeholder="Correo Electrónico">
          </td>
          <td class="align-middle text-center">
            <input type="checkbox" name="recipients-${index}-DELETE" value="on" class="recipient-delete" hidden>
            <button type="button" class="btn btn-icon btn-outline-danger btn-sm delete-recipient" title="Eliminar destinatario">
              <i class="icon ti ti-trash"></i>
            </button>
          </td>
        </tr>`;
    }

    addBtn.addEventListener('click', function () {
      tbody.insertAdjacentHTML('beforeend', recipientRowHtml(formIndex));
      formIndex += 1;
      totalForms.value = formIndex;
    });

    tbody.addEventListener('click', function (e) {
      const btn = e.target.closest('.delete-recipient');
      if (!btn) return;
      const row = btn.closest('tr');
      const del = row.querySelector('.recipient-delete');
      if (del) del.checked = true;
      row.classList.add('d-none');
    });
  });
  </script>
{% endblock extrajs %}
