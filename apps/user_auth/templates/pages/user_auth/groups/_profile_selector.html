{% if permission_profiles %}
<div class="mb-3">
  <div class="row g-2 align-items-center">
    <div class="col-12 col-md-8 col-lg-7 col-xl-6">
      <div class="d-flex justify-content-between align-items-center">
        <label class="form-label mb-0">Aplicar perfil predefinido</label>
        <button type="button" class="btn btn-link btn-sm text-secondary p-0" id="clear-all-btn">Desmarcar todos</button>
      </div>
      <div class="input-group mt-1">
        <select class="form-select" id="profile-select" aria-label="Perfil predefinido">
          <option value="">— Selecciona un perfil —</option>
          {% for profile in permission_profiles %}
          <option value="{{ profile.uuid }}"
                  data-permissions="[{% for p in profile.permissions.all %}{{ p.id }}{% if not forloop.last %},{% endif %}{% endfor %}]"
                  data-description="{{ profile.description|default:''|escapejs }}">
            {{ profile.name }} ({{ profile.permissions.count }} permisos)
          </option>
          {% endfor %}
        </select>
        <button type="button" class="btn btn-primary" id="apply-profile-btn">Aplicar</button>
      </div>
      <div class="form-hint mt-1 text-truncate" id="profile-description"></div>
    </div>
  </div>
</div>
{% endif %}
